name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Sync-Skript testen
        run: python -m unittest tests.test_sync -v

      - name: Seite im Browser testen
        run: python -m unittest tests.test_browser -v
